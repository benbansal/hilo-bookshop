# Hilo Bookshop — Netlify configuration

[build]
  publish = "."
  functions = "netlify/functions"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Route /api/airtable to the serverless function
[[redirects]]
  from = "/api/airtable"
  to   = "/.netlify/functions/airtable"
  status = 200

# Clean URLs
[[redirects]]
  from = "/catalogue"
  to = "/catalogue.html"
  status = 200

[[redirects]]
  from = "/threads"
  to = "/threads.html"
  status = 200

[[redirects]]
  from = "/thread"
  to = "/thread.html"
  status = 200

[[redirects]]
  from = "/events"
  to = "/events.html"
  status = 200

[[redirects]]
  from = "/objects"
  to = "/objects.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200
