# Hilo Bookshop — Netlify configuration

[build]
  publish = "."

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Clean URLs — redirect /catalogue to /catalogue.html etc
[[redirects]]
  from = "/catalogue"
  to = "/catalogue.html"
  status = 200

[[redirects]]
  from = "/threads"
  to = "/threads.html"
  status = 200

[[redirects]]
  from = "/thread"
  to = "/thread.html"
  status = 200

[[redirects]]
  from = "/events"
  to = "/events.html"
  status = 200

[[redirects]]
  from = "/objects"
  to = "/objects.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200
